<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wisp</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #6d5dfc; --other: #9ca3af; --reserve: #f59e0b; --danger: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #171a21; --fg: #e8eaf0; --muted: #8b93a3; --line: #262b36;
      --accent: #8f83ff; --other: #4b5263; --reserve: #d9920b; --danger: #f05252; --ok: #3ccf7a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #171a21; --fg: #e8eaf0; --muted: #8b93a3; --line: #262b36;
    --accent: #8f83ff; --other: #4b5263; --reserve: #d9920b; --danger: #f05252; --ok: #3ccf7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; }
  .label { display: flex; justify-content: space-between; font-size: 13px; margin: 10px 0 4px; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
  .bar span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .wrap { overflow-x: auto; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--danger); color: var(--danger);
           background: transparent; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  button:hover { background: var(--danger); color: var(--card); }
  .empty { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <header>
    <h1>wisp</h1>
    <span class="muted" id="status">carregando…</span>
  </header>
  <div id="hosts"></div>
</main>
<script>
const $hosts = document.getElementById("hosts");
const $status = document.getElementById("status");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, total) => Math.max(0, Math.min(100, total ? x / total * 100 : 0)).toFixed(2) + "%";
const gb = x => (Math.round(x * 10) / 10).toLocaleString("pt-BR") + " GB";

function hostCard(h) {
  if (!h.ok) return `<section class="card"><h2>${esc(h.host)} <span class="err">inacessível</span></h2>
    <div class="muted"><code>${esc(h.error)}</code></div></section>`;
  const used = h.mem_total_gb - h.mem_avail_gb;
  const wispReal = h.agents.reduce((s, a) => s + a.used_mib, 0) / 1024;
  const other = Math.max(0, used - wispReal);
  const running = h.agents.filter(a => a.state === "running");
  const rows = h.agents.map(a => `<tr>
      <td><span class="dot" style="background:var(${a.state === "running" ? "--ok" : "--other"})"></span><code>${esc(a.id)}</code></td>
      <td>${esc(a.state)}</td><td>${esc(a.age)}</td>
      <td class="num">${a.state === "running" ? a.used_mib.toLocaleString("pt-BR") + " MB" : "—"}</td>
      <td class="num">${a.ram_gb} GB</td><td class="num">${esc(a.cpu || "—")}</td>
      <td><button data-host="${esc(h.host)}" data-id="${esc(a.id)}">matar</button></td></tr>`).join("");
  return `<section class="card">
    <h2>${esc(h.host)} <span class="muted">${running.length} vivo${running.length === 1 ? "" : "s"}</span></h2>
    <div class="label"><span>RAM da máquina</span><span class="muted">${gb(used)} de ${gb(h.mem_total_gb)} em uso</span></div>
    <div class="bar">
      <span style="width:${pct(other, h.mem_total_gb)};background:var(--other)" title="outros processos"></span>
      <span style="width:${pct(wispReal, h.mem_total_gb)};background:var(--accent)" title="agentes wisp"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--other)"></i>outros (WAHA etc.) ${gb(other)}</span>
      <span><i style="background:var(--accent)"></i>agentes ${gb(wispReal)}</span>
      <span><i style="background:var(--line)"></i>livre ${gb(h.mem_avail_gb)}</span>
      <span class="muted">reserva mínima ${h.keep_free_gb} GB</span>
    </div>
    <div class="label"><span>Cota wisp</span><span class="muted">${h.quota_used_gb} de ${h.max_ram_gb} GB reservados</span></div>
    <div class="bar"><span style="width:${pct(h.quota_used_gb, h.max_ram_gb)};background:var(--accent)"></span></div>
    ${h.agents.length ? `<div class="wrap"><table>
      <tr><th>agente</th><th>estado</th><th>idade</th><th class="num">RAM real</th><th class="num">teto</th><th class="num">CPU</th><th></th></tr>
      ${rows}</table></div>` : `<div class="empty">Nenhum agente rodando.</div>`}
  </section>`;
}

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const d = await r.json();
    $hosts.innerHTML = d.hosts.map(hostCard).join("");
    $status.textContent = "atualizado " + new Date(d.at * 1000).toLocaleTimeString("pt-BR");
  } catch (e) {
    $status.innerHTML = `<span class="err">sem conexão com o wisp dash</span>`;
  }
}

$hosts.addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]");
  if (!b || !confirm(`Matar ${b.dataset.id} em ${b.dataset.host}?`)) return;
  b.disabled = true;
  await fetch(`/api/kill/${encodeURIComponent(b.dataset.host)}/${encodeURIComponent(b.dataset.id)}`, {method: "POST"});
  refresh();
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
