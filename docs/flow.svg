<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Como um wisp spawn funciona, em cinco passos">
<style>
  svg { --bg:#ffffff; --card:#f6f7f9; --fg:#16181d; --muted:#6b7280; --line:#d9dce3;
        --accent:#6d5dfc; --soft:#ece9ff; --mint:#0f9f6e; --key:#c77700; --other:#a3a9b6; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0f1115; --card:#171a21; --fg:#e8eaf0; --muted:#8b93a3; --line:#2c3240;
          --accent:#8f83ff; --soft:#25224a; --mint:#3ccf9a; --key:#f0a93b; --other:#4b5263; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--fg); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { fill: var(--muted); }
  .t { font-weight: 600; font-size: 15px; }
  .s { font-size: 12px; }
  .card { fill: var(--card); stroke: var(--line); }
  .anim { animation-duration: 15s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .probe { animation-name: probe; }
  .tok   { animation-name: tok; opacity: 0; }
  .cont  { animation-name: cont; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .work  { animation-name: work; opacity: 0; }
  .ram   { animation-name: ram; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
  .res   { animation-name: res; opacity: 0; }
  .c1 { animation-name: k1; } .c2 { animation-name: k2; opacity: 0; } .c3 { animation-name: k3; opacity: 0; }
  .c4 { animation-name: k4; opacity: 0; } .c5 { animation-name: k5; opacity: 0; }
  @keyframes probe { 0% { transform: translateX(0); opacity: 0 } 1% { opacity: 1 } 9% { transform: translateX(288px) }
                     17% { transform: translateX(0); opacity: 1 } 19%, 100% { transform: translateX(0); opacity: 0 } }
  @keyframes tok  { 0%, 20% { transform: translateX(0); opacity: 0 } 22% { opacity: 1 }
                    36% { transform: translateX(288px); opacity: 1 } 39%, 100% { transform: translateX(288px); opacity: 0 } }
  @keyframes cont { 0%, 40% { opacity: 0; transform: scale(.6) } 45%, 82% { opacity: 1; transform: scale(1) }
                    92%, 100% { opacity: 0; transform: scale(.6) } }
  @keyframes work { 0%, 60% { opacity: 0 } 64% { opacity: 1 } 68% { opacity: .2 } 72% { opacity: 1 } 76% { opacity: .2 }
                    80% { opacity: 1 } 82%, 100% { opacity: 0 } }
  @keyframes ram  { 0%, 58% { transform: scaleX(0) } 66%, 82% { transform: scaleX(1) } 92%, 100% { transform: scaleX(0) } }
  @keyframes res  { 0%, 81% { transform: translateX(288px); opacity: 0 } 83% { opacity: 1 }
                    96% { transform: translateX(0); opacity: 1 } 98%, 100% { transform: translateX(0); opacity: 0 } }
  @keyframes k1 { 0%, 18% { opacity: 1 } 20%, 100% { opacity: 0 } }
  @keyframes k2 { 0%, 19% { opacity: 0 } 21%, 38% { opacity: 1 } 40%, 100% { opacity: 0 } }
  @keyframes k3 { 0%, 39% { opacity: 0 } 41%, 58% { opacity: 1 } 60%, 100% { opacity: 0 } }
  @keyframes k4 { 0%, 59% { opacity: 0 } 61%, 78% { opacity: 1 } 80%, 100% { opacity: 0 } }
  @keyframes k5 { 0%, 79% { opacity: 0 } 81%, 98% { opacity: 1 } 100% { opacity: 0 } }
</style>
<rect width="900" height="380" rx="16" fill="var(--bg)"/>
<text x="24" y="34" class="t" style="font-size:17px">Como um <tspan class="mono" style="font-size:15px">wisp spawn</tspan> funciona</text>

<!-- controlador -->
<rect x="24" y="56" width="270" height="200" rx="14" class="card"/>
<text x="44" y="86" class="t">Seu computador</text>
<text x="44" y="104" class="s muted">controlador · nada fica rodando</text>
<text x="44" y="136" class="mono">Claude Code / Codex</text>
<text x="44" y="158" class="mono muted">  └ MCP wisp</text>
<text x="44" y="180" class="mono muted">      └ CLI wisp</text>
<text x="44" y="212" class="mono">~/.wisp/hosts.json</text>
<text x="44" y="234" class="mono">logins (ficam aqui)</text>

<!-- ssh -->
<line x1="294" y1="156" x2="606" y2="156" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
<text x="450" y="140" class="s muted" text-anchor="middle">SSH</text>

<!-- host -->
<rect x="606" y="56" width="270" height="200" rx="14" class="card"/>
<text x="626" y="86" class="t">optimus</text>
<text x="626" y="104" class="s muted">host · só precisa de Docker</text>
<rect x="626" y="118" width="230" height="74" rx="10" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
<g class="anim cont">
  <rect x="646" y="130" width="190" height="50" rx="9" fill="var(--soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="660" y="151" class="mono" style="fill:var(--accent)">wp-3b6074</text>
  <text x="660" y="170" class="s muted">teto 1 GB · sem root</text>
  <g class="anim work" fill="var(--accent)"><circle cx="800" cy="147" r="3.5"/><circle cx="812" cy="147" r="3.5"/><circle cx="824" cy="147" r="3.5"/></g>
</g>
<text x="626" y="215" class="s muted">RAM</text>
<rect x="660" y="205" width="196" height="12" rx="6" fill="var(--line)"/>
<rect x="660" y="205" width="78" height="12" fill="var(--other)"/>
<rect x="738" y="205" width="22" height="12" fill="var(--accent)" class="anim ram"/>
<g class="s muted">
  <rect x="660" y="228" width="9" height="9" rx="2" fill="var(--other)"/><text x="674" y="236" class="s muted">outros</text>
  <rect x="724" y="228" width="9" height="9" rx="2" fill="var(--accent)"/><text x="738" y="236" class="s muted">agente</text>
  <rect x="792" y="228" width="9" height="9" rx="2" fill="var(--line)"/><text x="806" y="236" class="s muted">livre</text>
</g>

<!-- pacotes -->
<g class="anim probe"><circle cx="306" cy="156" r="9" fill="var(--bg)" stroke="var(--fg)" stroke-width="2"/>
  <text x="306" y="160.5" text-anchor="middle" class="s" style="font-weight:700">?</text></g>
<g class="anim tok"><rect x="282" y="146" width="50" height="20" rx="10" fill="var(--key)"/>
  <text x="307" y="160" text-anchor="middle" class="s" style="fill:#fff;font-weight:600">token</text></g>
<g class="anim res"><rect x="288" y="145" width="38" height="22" rx="4" fill="var(--mint)"/>
  <path d="M290 147 L307 159 L324 147" fill="none" stroke="#fff" stroke-width="1.8"/></g>

<!-- legendas -->
<g text-anchor="middle" style="font-size:15px">
  <text x="450" y="306" class="anim c1">1 · pergunta a cada host quanta RAM livre ele tem</text>
  <text x="450" y="306" class="anim c2">2 · escolhe o host e manda só o access token, pelo stdin do SSH</text>
  <text x="450" y="306" class="anim c3">3 · o container nasce: sem root, disco só leitura, teto de RAM</text>
  <text x="450" y="306" class="anim c4">4 · o agente trabalha: usa ~200 MB de verdade, não o teto inteiro</text>
  <text x="450" y="306" class="anim c5">5 · wisp wait: o resultado volta e o container é apagado</text>
</g>
<g fill="var(--line)"><circle cx="410" cy="340" r="5"/><circle cx="430" cy="340" r="5"/><circle cx="450" cy="340" r="5"/><circle cx="470" cy="340" r="5"/><circle cx="490" cy="340" r="5"/></g>
<g fill="var(--accent)">
  <circle cx="410" cy="340" r="5" class="anim c1"/><circle cx="430" cy="340" r="5" class="anim c2"/><circle cx="450" cy="340" r="5" class="anim c3"/>
  <circle cx="470" cy="340" r="5" class="anim c4"/><circle cx="490" cy="340" r="5" class="anim c5"/>
</g>
</svg>
